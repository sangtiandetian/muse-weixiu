  ov.lastChild.textContent=cap;
  ov.addEventListener('click',function(){document.body.removeChild(ov)});
  document.addEventListener('keydown',function esc(ev){if(ev.key==='Escape'){if(ov.parentNode)document.body.removeChild(ov);document.removeEventListener('keydown',esc)}});
  document.body.appendChild(ov);
});
})();
